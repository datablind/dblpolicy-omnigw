---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: DataBlind AgentGuard
    description: Cryptographic field governance for APIs and AI agent (MCP) responses
    category: Custom
    metadata/interfaceScope: api,resource
    metadata/capabilities/injectionPoint: inbound
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    dataBlindKey:
      type: string
      format: dataweave
      description: Encryption Key used by the DataBlind
      default: "#['1234567812345678']"
      "@context":
        "@characteristics":
          - security:sensitive
    tweak:
      type: string
      format: dataweave
      description: Payload Field to be used as Encryption Tweak
      default: "#[payload.Id default '12345678']"
      bindings:
        payload:
          mimeType: json
        attributes: true
    dataCryptService:
      type: string
      format: service
      description: Base URI of the DataBlind DataCrypt REST service, including the API Gateway stage (e.g. .../Prod). Policy paths such as /filter are appended to this base.
      default: "https://kwoz0lfnn8.execute-api.us-west-1.amazonaws.com/Dev"
    dataCryptApiKey:
      type: string
      description: API key sent as the x-api-key header when calling the DataBlind DataCrypt REST service
      default: "Please contact mulesoftconnector@ztensor.com"
      "@context":
        "@characteristics":
          - security:sensitive
    sensitiveFieldsSpecified:
      type: boolean
      description: If selected, then the sensitiveFields will be specified manually.
      default: false
    dataBlindApiKey:
      type: string
      description: API Key for DataBlind AI Redaction API
      default: "Please contact mulesoftconnector@ztensor.com"
      "@context":
        "@characteristics":
          - security:sensitive
      "@rendering":
        "@visibleOn":
          - property: sensitiveFieldsSpecified
            value: false
    sensitiveFieldsMultiLine:
      type: array
      items:
        type: string
      description: Multi Line Sensitive fields in the API response (use Add to add more entries)
      default:
        - '{ "Name" : "FE:PersonName", "TaxId" : "FE:SSN" }'
      "@rendering":
        "@visibleOn":
          - property: sensitiveFieldsSpecified
            value: true
    eligibleHttpCodes:
      type: string
      format: dataweave
      description: Apply Datablind only when the API response has the following HTTP Codes
      default: "#['200,201,202,205,213']"
    dataBlindToken:
      type: string
      format: dataweave
      description: When a valid override token is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindToken']]"
    dataBlindPassphrase:
      type: string
      format: dataweave
      description: When a valid override token passphrase is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindPassphrase']]"
    filterMode:
      type: string
      title: Filter Rule
      description: >-
        Choose Include or Exclude filter.
        Include filter will only include the matching message in the response, all others will be filtered out.
        Exclude filter will exclude the matching message from the response, and any unmatched message will be included in the response.
      enum:
        - None
        - Include
        - Exclude
      default: None
    includeField:
      type: string
      title: Include Filter Json Field
      description: >-
        e.g. person.phone
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Include
    includeValue:
      type: string
      title: Include Filter Json Value
      description: >-
        Include only the following values in the response (e.g. 1234567890, 0987654321).
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Include
    excludeField:
      type: string
      title: Exclude Filter Json Field
      description: >-
        e.g. person.phone
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Exclude
    excludeValue:
      type: string
      title: Exclude Filter Json Value
      description: >-
        Exclude the following values in the response (e.g. 1234567890, 0987654321).
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Exclude
  required:
    - dataBlindKey
    - tweak
    - sensitiveFieldsSpecified
    - eligibleHttpCodes
    - dataBlindToken
    - dataBlindPassphrase
    - dataCryptService
    - dataCryptApiKey

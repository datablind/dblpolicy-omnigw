---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP DataBlind
    description: Cryptographic field governance for APIs and Agents in MCP response
    category: Custom
    metadata/interfaceScope: api,resource
    metadata/capabilities/injectionPoint: inbound
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    encryptMode:
      type: string
      title: 1. Sensitive Data Encryption
      description: Choose how the sensitive fields are provided for encryption
      enum:
        - None
        - Specify Sensitive fields
        - Determine Sensitive fields using NLP (Identifies PII related to Financial, Contact, Identity, Auth, Device, Tax, Health, Vehicle, GOV ID, and URL data)
      default: None
    sensitiveFieldsMultiLine:
      type: string
      title: Sensitive Fields
      description: 'Sensitive fields in the API response as a JSON object (e.g. { "Name" : "FE:PersonName", "TaxId" : "FE:SSN" })'
      default: '{ "Name" : "FE:PersonName", "TaxId" : "FE:SSN" }'
      "@rendering":
        "@visibleOn":
          - property: encryptMode
            value: Specify Sensitive fields
    filterMode:
      type: string
      title: 2. Message Filter Configuration
      description: >-
        Choose Include or Exclude filter.
        Include filter will only include the matching message in the response, all others will be filtered out.
        Exclude filter will exclude the matching message from the response, and any unmatched message will be included in the response.
      enum:
        - None
        - Include
        - Exclude
      default: None
    filterOperator:
      type: string
      title: Filter Match Operator
      description: >-
        How multiple filter conditions are combined. OR matches a message when any condition matches; AND matches only when all conditions match.
      enum:
        - OR
        - AND
      default: OR
    filterConditions:
      type: array
      title: Filter Conditions
      description: >-
        One or more field conditions used for filtering. Each condition has a JSON field path, a
        match type, and a value. Conditions are combined using the Filter Match Operator (OR/AND).
      items:
        type: object
        properties:
          field:
            type: string
            title: Field
            description: JSON field path (e.g. person.phone or customer.address.state).
          matchType:
            type: string
            title: Match Type
            description: >-
              Applies only to a single value. Simple compares the value directly; Exact and Regex
              wrap it as { "type": "exact|regex", "value": "..." } for the DataCrypt filter API.
              Match Type is ignored when multiple (comma-separated) values are provided, since an
              array is matched as "any of".
            enum:
              - Simple
              - Exact
              - Regex
            default: Simple
          value:
            type: string
            title: Value
            description: >-
              Value to match. For multiple values, use a comma-separated list (e.g. 123,456); it is
              sent as an array and matched as "any of" (Regex/Exact do not apply to arrays).
    dataCryptService:
      type: string
      format: service
      title: 3. DataBlind Service URI
      description: Base URI of the DataBlind API service, including the API Gateway stage (e.g. .../Dev or /Prod).
      default: "https://kwoz0lfnn8.execute-api.us-west-1.amazonaws.com/Dev"
    dataCryptApiKey:
      type: string
      title: 4. DataBlind Service Key
      description: API key will be sent as the x-api-key header when calling the DataBlind API service
      default: "Please contact mulesoftconnector@ztensor.com"
      "@context":
        "@characteristics":
          - security:sensitive
    dataBlindKey:
      type: string
      format: dataweave
      title: 5. DataBlind Key
      description: Encryption Key used by the DataBlind
      default: "#['1234567812345678']"
      "@context":
        "@characteristics":
          - security:sensitive
    keyId:
      type: string
      title: 5a. DataBlind Key ID
      description: >-
        The GUID of the DataBlind app zone. When set, the policy fetches the app zone's key from DataBlind
        at request time and the DataBlind Key (5) is ignored. Requires 5b and 5c.
    keyServiceUrl:
      type: string
      format: service
      title: 5b. DataBlind Key Service URI
      description: Base URI of the DataBlind control plane functions, e.g. https://<project>.supabase.co/functions/v1
    policyAccessKey:
      type: string
      title: 5c. Policy Access Key
      description: Created in DataBlind for the app zone. Sent as the x-policy-access-key header when fetching the key.
      "@context":
        "@characteristics":
          - security:sensitive
    tweak:
      type: string
      format: dataweave
      title: 6. Tweak
      description: Payload Field to be used as Encryption Tweak
      default: "#[payload.Id default '12345678']"
      bindings:
        payload:
          mimeType: json
        attributes: true
    eligibleHttpCodes:
      type: string
      format: dataweave
      title: 7. Eligible HTTP Codes
      description: Apply Datablind only when the API response has the following HTTP Codes
      default: "#['200,201,202,205,213']"
    dataBlindToken:
      type: string
      format: dataweave
      title: 8. DataBlind Token
      description: When a valid override token is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindToken']]"
    dataBlindPassphrase:
      type: string
      format: dataweave
      title: 9. DataBlind Passphrase
      description: When a valid override token passphrase is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindPassphrase']]"
    debugLogging:
      type: boolean
      title: 10. Debug Logging (Request/Response Payloads)
      description: >-
        Enable in lower environments (e.g. Dev/Test) to log the request and response message
        payloads. Leave disabled in higher environments (e.g. Prod) to avoid logging sensitive data.
      default: false
  required:
    - tweak
    - eligibleHttpCodes
    - dataBlindToken
    - dataBlindPassphrase
    - dataCryptService
    - dataCryptApiKey

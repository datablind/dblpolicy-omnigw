---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP DataBlind
    description: Cryptographic field governance for APIs and Agents in MCP response
    category: Custom
    metadata/interfaceScope: api,resource
    metadata/capabilities/injectionPoint: inbound
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    encryptMode:
      type: string
      title: 1. Sensitive Data Encryption
      description: Choose how the sensitive fields are provided for encryption
      enum:
        - None
        - Specify Sensitive fields
        - Determine Sensitive fields using NLP (Identifies PII related to Financial, Contact, Identity, Auth, Device, Tax, Health, Vehicle, GOV ID, and URL data)
      default: None
    sensitiveFieldsMultiLine:
      type: string
      title: Sensitive Fields
      description: 'Sensitive fields in the API response as a JSON object (e.g. { "Name" : "FE:PersonName", "TaxId" : "FE:SSN" })'
      default: '{ "Name" : "FE:PersonName", "TaxId" : "FE:SSN" }'
      "@rendering":
        "@visibleOn":
          - property: encryptMode
            value: Specify Sensitive fields
    filterMode:
      type: string
      title: 2. Message Filter Configuration
      description: >-
        Choose Include or Exclude filter.
        Include filter will only include the matching message in the response, all others will be filtered out.
        Exclude filter will exclude the matching message from the response, and any unmatched message will be included in the response.
      enum:
        - None
        - Include
        - Exclude
      default: None
    includeField:
      type: string
      title: Include Filter Json Field
      description: >-
        e.g. person.phone
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Include
    includeValue:
      type: string
      title: Include Filter Json Value
      description: >-
        Include only the following values in the response (e.g. 1234567890, 0987654321).
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Include
    excludeField:
      type: string
      title: Exclude Filter Json Field
      description: >-
        e.g. person.phone
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Exclude
    excludeValue:
      type: string
      title: Exclude Filter Json Value
      description: >-
        Exclude the following values in the response (e.g. 1234567890, 0987654321).
      default: ""
      "@rendering":
        "@visibleOn":
          - property: filterMode
            value: Exclude
    dataCryptService:
      type: string
      format: service
      title: 3. DataBlind Service URI
      description: Base URI of the DataBlind API service, including the API Gateway stage (e.g. .../Dev or /Prod).
      default: "https://kwoz0lfnn8.execute-api.us-west-1.amazonaws.com/Dev"
    dataCryptApiKey:
      type: string
      title: 4. DataBlind Service Key
      description: API key will be sent as the x-api-key header when calling the DataBlind API service
      default: "Please contact mulesoftconnector@ztensor.com"
      "@context":
        "@characteristics":
          - security:sensitive
    dataBlindKey:
      type: string
      format: dataweave
      title: 5. DataBlind Key
      description: Encryption Key used by the DataBlind
      default: "#['1234567812345678']"
      "@context":
        "@characteristics":
          - security:sensitive
    tweak:
      type: string
      format: dataweave
      title: 6. Tweak
      description: Payload Field to be used as Encryption Tweak
      default: "#[payload.Id default '12345678']"
      bindings:
        payload:
          mimeType: json
        attributes: true
    eligibleHttpCodes:
      type: string
      format: dataweave
      title: 7. Eligible HTTP Codes
      description: Apply Datablind only when the API response has the following HTTP Codes
      default: "#['200,201,202,205,213']"
    dataBlindToken:
      type: string
      format: dataweave
      title: 8. DataBlind Token
      description: When a valid override token is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindToken']]"
    dataBlindPassphrase:
      type: string
      format: dataweave
      title: 9. DataBlind Passphrase
      description: When a valid override token passphrase is provided, Datablind returns the unencrypted and unmasked data
      default: "#[attributes.headers['dataBlindPassphrase']]"
  required:
    - dataBlindKey
    - tweak
    - eligibleHttpCodes
    - dataBlindToken
    - dataBlindPassphrase
    - dataCryptService
    - dataCryptApiKey

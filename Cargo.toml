[package]
name = "mcp_datablind"
version = "1.7.9"
rust-version = "1.87.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "acda9d4d-1bfb-4b44-9b48-6f8f49157bbd"
#group_id = "3a209eb5-371f-4b87-aaa2-19c539592cea"

definition_asset_id = "mcp-datablind"
implementation_asset_id = "mcp-datablind-flex"

[dependencies]
pdk = { version = "1.9.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"

[dev-dependencies]
pdk-test = { version = "1.9.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
